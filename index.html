<style>
  .hero {

  color: white;
  background:
    linear-gradient(rgba(10, 50, 30, 0.75), rgba(10, 50, 30, 0.75)),
    url("hero.jpg") center / cover no-repeat,
    #14532d;
}
.hero h1 { color: white; margin: 0; }
  .gambar {
  width: 100%;
  max-height: 300px;
  object-fit: cover;
  border-radius: 14px;
  margin-bottom: 24px;
}
  body {
    font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
    background: #f6f3f5;
    color: #2b1d22;
    max-width: 800px;
    margin: 0 auto;
    padding: 32px 20px;
  }
  h1 { color: #531433; margin-bottom: 24px; }
<img src="hero.jpg" alt="Ilustrasi keuangan" class="gambar">
  form {
    background: white;
    padding: 24px;
    max-width: 420px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input {
    display: block;
    width: 100%;
    padding: 10px;
    margin-bottom: 16px;
    border: 1px solid #c4b6bd;
    border-radius: 8px;
    font-size: 1rem;
    box-sizing: border-box;
  }
  input:focus { outline: 3px solid #ef86ae; border-color: #14532d; }

  button {
    padding: 12px 28px;
    background: #14532d;
    color: rgb(255, 255, 255);
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #65163b; }

  table {
    width: 100%;
    margin-top: 32px;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
  th, td { padding: 10px 14px; text-align: right; border-bottom: 1px solid #e3ebe6; }
  th:first-child, td:first-child { text-align: center; }
  th { background: #dcfce7; }
  tbody tr:nth-child(even) { background: #f7fbf8; }
  .kotak-grafik {
    background: white;
    padding: 16px;
    margin-top: 32px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
</style>
<body>
  <h1>Kalkulator Anuitas</h1>
  <img src="hero.jpg" alt="Ilustrasi keuangan" class="gambar">
  <footer>
<p>Oleh:</p>
<p>Abu Farhan Zakaria(1)</p>
<p>Alifia Syakira Ivana (4)</p>
<p>Jihan Aurelia Pratama Putri (17)</p>
<p>Kania Putri Anjarsari (18)</p>
<p>Muhammad Azka Fathurrahman (23)</p>
</footer>
  <form id="form-anuitas">
  <label for="pinjaman">Jumlah Pinjaman (Rp)</label>
  <input type="number" id="pinjaman">

  <label for="bunga">Bunga per Bulan (%)</label>
  <input type="number" id="bunga" step="any">

  <label for="bulan">Jangka Waktu (Bulan)</label>
  <input type="number" id="bulan">

  <button type="submit">Hitung</button>
</form><div class="kotak-grafik">
  <canvas id="grafik"></canvas>
</div>
<table border="1">
  <thead>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <tr>
      <th>Bulan</th>
      <th>Angsuran Pokok</th>
      <th>Bunga</th>
      <th>Anuitas</th>
      <th>Sisa Pinjaman</th>
    </tr>
  </thead>
  <tbody id="isi-tabel"></tbody>
</table>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
  const form = document.getElementById("form-anuitas");
  const isiTabel = document.getElementById("isi-tabel");
  let grafik; // tempat menyimpan grafik supaya bisa diganti saat dihitung ulang

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    const pinjaman = Number(document.getElementById("pinjaman").value);
    const bunga = Number(document.getElementById("bunga").value) / 100;
    const bulan = Number(document.getElementById("bulan").value);

    const anuitas = (pinjaman * bunga) / (1 - Math.pow(1 + bunga, -bulan));

    let sisa = pinjaman;
    let baris = "";
 
    // Tiga daftar kosong untuk data grafik
    const labelBulan = [];
    const dataPokok = [];
    const dataBunga = [];

    for (let b = 1; b <= bulan; b++) {
      const bungaBulanIni = sisa * bunga;
      const pokok = anuitas - bungaBulanIni;
      sisa = sisa - pokok;

      // Simpan data bulan ini untuk grafik
      labelBulan.push(b);
      dataPokok.push(Math.round(pokok));
      dataBunga.push(Math.round(bungaBulanIni));

      baris += `<tr>
        <td>${b}</td>
        <td>${Math.round(pokok).toLocaleString("id-ID")}</td>
        <td>${Math.round(bungaBulanIni).toLocaleString("id-ID")}</td>
        <td>${Math.round(anuitas).toLocaleString("id-ID")}</td>
        <td>${Math.round(Math.abs(sisa)).toLocaleString("id-ID")}</td>
      </tr>`;
    }

    isiTabel.innerHTML = baris;

    // Gambar grafik
    if (grafik) { grafik.destroy(); } // hapus grafik lama kalau ada

    grafik = new Chart(document.getElementById("grafik"), {
      type: "bar",
      data: {
        labels: labelBulan,
        datasets: [
          { label: "Angsuran Pokok", data: dataPokok, backgroundColor: "#14532d" },
          { label: "Bunga", data: dataBunga, backgroundColor: "#86efac" }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: { display: true, text: "Komposisi Anuitas per Bulan" }
        },
        scales: {
          x: { stacked: true, title: { display: true, text: "Bulan" } },
          y: { stacked: true, title: { display: true, text: "Rupiah" } }
        }
      }
    });
  });
</script>
</body>
